<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ratsiya kuzatuvchi</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#12161d;--mut:#667085;--bd:#e1e5ea;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#1a1f29;--tx:#eef1f5;--mut:#9aa4b2;--bd:#2b3340;--ac:#6b96ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#1a1f29;--tx:#eef1f5;--mut:#9aa4b2;--bd:#2b3340;--ac:#6b96ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin-inline:auto}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--ac);color:#fff;cursor:pointer}
.btn.big{width:100%;font-size:18px;padding:16px}
.btn.stop{background:var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text]{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
input[type=text]{flex:1}
#st{font-size:14px;color:var(--mut);margin-top:8px;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
#live{font-size:14px;color:var(--mut);min-height:20px;margin-top:6px;word-break:break-word}
.alert{border:2px solid var(--bad);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.alert.maybe{border-color:var(--warn)}
.cls{display:inline-block;font-weight:800;font-size:26px;letter-spacing:.5px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;background:var(--bad);margin-left:6px;vertical-align:middle}
.maybe .tag{background:var(--warn)}
.nm{font-size:19px;font-weight:600;margin:2px 0 10px}
.alert .row .btn{flex:1}
h2{font-size:15px;margin:10px 0 6px;color:var(--mut)}
.stu{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:9px 2px;cursor:pointer}
.stu:last-child{border-bottom:0}
.s-sent{color:var(--ok);font-weight:600}.s-al{color:var(--warn);font-weight:600}
.sent .n{text-decoration:line-through;color:var(--mut)}
#empty{color:var(--mut);text-align:center;padding:8px}
small{color:var(--mut)}
</style></head><body>
<h1>📻 Ratsiya kuzatuvchi — 0-H va 3-L</h1>

<div class="card">
  <button id="go" class="btn big">🎙 Eshitishni boshlash</button>
  <div class="row" style="margin-top:10px">
    <select id="lang"><option value="ru-RU">Ratsiyada: rus tilida</option><option value="uz-UZ">Ratsiyada: o’zbek tilida</option></select>
  </div>
  <div id="st"><span class="dot" id="dot"></span><span id="stx">To’xtatilgan</span></div>
  <div id="live"></div>
</div>

<div id="alerts"></div>
<div id="empty" class="card">Hozircha chaqirilgan o’quvchi yo’q</div>

<div class="card">
  <h2 style="margin-top:0">Sinov (mikrofonsiz)</h2>
  <div class="row"><input type="text" id="t" placeholder="Masalan: Ахмедов Амирбек"><button class="btn" id="tb">Tekshir</button></div>
</div>

<div class="card"><div id="list"></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost" id="rs">Kunni qayta boshlash</button></div>
  <small>Ro’yxatdagi ismni bossangiz, qo’lda belgilanadi. Telefonni ratsiya dinamigi yoniga qo’ying. Chrome va internet kerak.</small>
</div>

<script>
const RAW=`0-H class
Мисс Сайкал
Miss Durdona
Авлокулов Аминмухаммад
Бауржан Сатжан
Бахромова Сакинахон
Гафуржанов Салим
Кадирова Диёра
Кодирова Асия
Мамуржонов Бехрузжон
Ткачев Аркадий
Хабибуллаева Хабиба
Хикматуллаева Самира
Шамилев Мансур 5-лет
Мустафин Миран
Юсупходжаев Махаматхожа
Якубов Мусобек
Шофайзиев Джамолиддин
3-L class
Ким Вероника Андреевна
Ахмедов Амирбек
Ахмедов Дониёр
Камалов СаидУмархон
Магомедов Расул
Мулладжанова Аниса
Мухтарова Анисахон
Норматов Хусан
Норматова Фатима
Рустамов Мирон
Усманов Бехруз
Усманова Зульфияхон
Хабибуллаев Бурхон
Шаякубов Рузимурод
Толибжонов Мухаммадюсуф`;
const CY={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"J",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"s",ч:"C",ш:"S",щ:"S",ъ:"",ь:"",ы:"i",э:"e",ю:"yu",я:"ya",ў:"o",қ:"k",ғ:"g",ҳ:"h"};
function norm(t){
  t=t.toLowerCase().replace(/[ʻʼ’‘`´]/g,"'").replace(/o'/g,"o").replace(/g'/g,"g").replace(/sh/g,"S").replace(/ch/g,"C").replace(/zh/g,"J").replace(/x/g,"h").replace(/q/g,"k").replace(/w/g,"v").replace(/j/g,"J").replace(/ts/g,"s");
  return [...t].map(c=>CY[c]!==undefined?CY[c]:c).join("").replace(/[^a-zA-Z]/g,"").replace(/(.)\1+/g,"$1");
}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);

const S=[];let cls="";
RAW.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
  const m=l.match(/^(\d+-\S+)\s+class$/i);
  if(m){cls=m[1];return}
  const p=l.split(/\s+/).filter(x=>!/\d/.test(x)),nw=p.slice(1);
  S.push({c:cls,full:p.join(" "),n1:norm(p[0]),n2:[norm(nw.join("")),...nw.map(norm).filter(x=>x.length>=4)]});
});

const $=id=>document.getElementById(id);
const day=new Date().toISOString().slice(0,10);
let sent={},alerts={},ign={};
try{sent=JSON.parse(localStorage.getItem("sent-"+day)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("sent-"+day,JSON.stringify(sent))}catch(e){}};

function match(text){
  const w=text.split(/\s+/).map(norm).filter(Boolean),g=[];
  for(let i=0;i<w.length;i++){let s="";for(let k=0;k<3&&i+k<w.length;k++){s+=w[i+k];g.push(s)}}
  const hit=t=>{if(t.length<3)return false;const th=t.length<=4?.8:.74;return g.some(x=>Math.abs(x.length-t.length)<=3&&sim(x,t)>=th)};
  let r=[];
  S.forEach((s,i)=>{const a=hit(s.n1),b=s.n2.some(hit);if(a||b)r.push({i,l:a&&b?2:1})});
  const sure=r.filter(x=>x.l==2);
  if(sure.length)r=r.filter(x=>x.l==2||!sure.some(t=>sim(S[x.i].n1,S[t.i].n1)>=.8||sim(S[x.i].n2[0],S[t.i].n2[0])>=.8));
  return r;
}

let ctx;
function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  [880,1175].forEach((f,k)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(.25,ctx.currentTime+k*.18);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+k*.18+.16);o.start(ctx.currentTime+k*.18);o.stop(ctx.currentTime+k*.18+.17)});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

function raise(i,l){
  if(sent[i]||(ign[i]&&ign[i]>Date.now()))return;
  const a=alerts[i];if(a&&a.l>=l)return;
  alerts[i]={l};beep();
  try{if(window.Notification&&Notification.permission==="granted"&&document.hidden)new Notification(S[i].c+" — "+S[i].full)}catch(e){}
  draw();
}
function handle(txt,fin){match(txt).forEach(m=>{if(m.l==2||fin)raise(m.i,m.l)})}

function draw(){
  const ids=Object.keys(alerts);
  $("empty").style.display=ids.length?"none":"block";
  $("alerts").innerHTML=ids.map(i=>{const a=alerts[i],s=S[i];
    return `<div class="alert ${a.l==2?"":"maybe"}"><span class="cls">${s.c}</span><span class="tag">${a.l==2?"ANIQ":"EHTIMOL"}</span>
    <div class="nm">${s.full}</div><div class="row"><button class="btn ok" data-s="${i}">✓ Jo’natdim</button><button class="btn ghost" data-x="${i}">Xato</button></div></div>`}).join("");
  let h="",c="";
  S.forEach((s,i)=>{
    if(s.c!==c){c=s.c;h+=`<h2>${c}</h2>`}
    const st=sent[i]?'<span class="s-sent">✓ jo’natildi</span>':alerts[i]?'<span class="s-al">● chaqirildi</span>':"";
    h+=`<button class="stu ${sent[i]?"sent":""}" data-m="${i}"><span class="n">${s.full}</span>${st}</button>`});
  $("list").innerHTML=h;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.s!==undefined){sent[d.s]=1;delete alerts[d.s];save();draw()}
  else if(d.x!==undefined){delete alerts[d.x];ign[d.x]=Date.now()+60000;draw()}
  else if(d.m!==undefined){if(sent[d.m]){delete sent[d.m];save();draw()}else raise(+d.m,2)}
});
$("tb").onclick=()=>{const v=$("t").value;if(v.trim()){$("live").textContent="Sinov: "+v;handle(v,true)}};
$("rs").onclick=()=>{if(confirm("Barcha belgilar tozalansinmi?")){sent={};alerts={};ign={};save();draw()}};

let rec,on=false,wl;
function ui(){$("go").textContent=on?"⏹ To’xtatish":"🎙 Eshitishni boshlash";$("go").classList.toggle("stop",on);$("dot").classList.toggle("on",on);$("stx").textContent=on?"Ratsiya tinglanmoqda…":"To’xtatilgan"}
$("go").onclick=()=>{
  if(on){on=false;try{rec.stop()}catch(e){}try{wl&&wl.release()}catch(e){}ui();return}
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){$("stx").textContent="Brauzer ovozni tanimaydi — Chrome’da oching";return}
  beep();
  try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>wl=l)}catch(e){}
  rec=new R();rec.lang=$("lang").value;rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let t="",f=false;for(let i=e.resultIndex;i<e.results.length;i++){t+=" "+e.results[i][0].transcript;if(e.results[i].isFinal)f=true}
    $("live").textContent=t.trim();handle(t,f)};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){on=false;ui();$("stx").textContent="Mikrofonga ruxsat berilmadi. Sahifani Chrome’da to’g’ridan-to’g’ri oching."}};
  rec.onend=()=>{if(on)setTimeout(()=>{try{rec.start()}catch(e){}},250);else ui()};
  on=true;try{rec.start()}catch(e){}ui();
};
document.addEventListener("visibilitychange",()=>{if(on&&!document.hidden){try{navigator.wakeLock.request("screen").then(l=>wl=l)}catch(e){}}});
draw();ui();
</script></body></html>
